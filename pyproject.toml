[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-drip"
version = "0.0.0"
description = "Research-oriented, low-frequency data ingestion for prediction markets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "market-drip contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
]

dependencies = ["httpx>=0.25", "pandas>=2.0", "pyarrow>=14.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-httpx>=0.29"]

[project.scripts]
market-drip = "market_drip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_drip*"]

[tool.pytest.ini_options]
addopts = "-q"
